name: Render the figure

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-plot:
    runs-on: ubuntu-latest

    container:
      image: python:3.11  # Includes pip and can install matplotlib
      options: --user root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install matplotlib and matplotlib_tufte
        run: |
          pip install --no-cache-dir matplotlib
          pip install --no-cache-dir "matplotlib_tufte @ git+https://github.com/ninivert/matplotlib_tufte.git"

      - name: Run the plot
        run: python plot.py

      - name: Check web/data/curves.json is up to date
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python make_web_data.py
          if ! git diff --quiet -- web/data/curves.json; then
            echo "web/data/curves.json is stale. Run 'python make_web_data.py' and commit the result." >&2
            git diff --stat -- web/data/curves.json >&2
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuonColliderRates
          path: |
            MuonColliderRates.pdf
            MuonColliderRates.png
